name: Build Dleishan VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o DleishanVPN-Starter.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=warning
          elif [ -n "$(find . -name 'gradlew' -print -quit)" ]; then
            GRADLEW_PATH=$(find . -name 'gradlew' -print -quit)
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x gradlew
            ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=warning
          else
            SETTINGS_PATH=$(find . \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
            if [ -n "$SETTINGS_PATH" ]; then
              cd "$(dirname "$SETTINGS_PATH")"
            fi
            gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DleishanVPN-APK
          path: "**/*.apk"
